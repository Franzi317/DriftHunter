[project]
name = "drifthunter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "httpx>=0.27",
    "click>=8.1",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
    "nasdaq-data-link>=1.0.4",
]

[project.scripts]
drifthunter = "drifthunter.cli:cli"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drifthunter"]
